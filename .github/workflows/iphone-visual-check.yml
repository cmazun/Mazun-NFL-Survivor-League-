name: iPhone dashboard screenshot test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone-visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.58.2-linux
      - name: Install Playwright package
        run: npm install --no-save --no-audit --no-fund playwright@1.58.2
      - name: Install browser and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install OS dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: sudo npx playwright install-deps chromium
      - name: Capture iPhone screenshots and test interactions
        run: node scripts/iphone-check.cjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-dashboard-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
